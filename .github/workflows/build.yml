name: Build Marble GKI Tuned Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Tuned Marble GKI Kernel (KSU-Next + SuSFS v2.4.0)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git gnupg gperf libelf-dev \
            libssl-dev libxml2-utils lz4 lzop zip zlib1g-dev python3 python-is-python3 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Download AOSP Clang Toolchain
        run: |
          mkdir -p clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz

      - name: Clone GKI 5.10 Kernel Source
        run: |
          git clone --depth=1 --branch android12-5.10 https://android.googlesource.com/kernel/common kernel_source

      - name: Integrate KernelSU and SuSFS (v2.4.0)
        run: |
          git clone https://github.com/tiann/KernelSU.git KernelSU
          git -C KernelSU checkout c680b548f3fe5c19f51e90ce97d6f0ef89594421
          git clone --depth=1 --branch gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git susfs

          # 1. Patch KernelSU with SuSFS v2.4.0
          cd KernelSU
          patch -p1 < ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          # Bypass apk signature check so any Manager APK (KernelSU Manager / KernelSU-Next Manager) is accepted
          sed -i 's/return check_v2_signature(path, EXPECTED_SIZE, EXPECTED_HASH);/return true;/g' kernel/manager/apk_sign.c
          cd ..

          # 2. Patch kernel_source with SuSFS v2.4.0
          cd kernel_source
          cp -r ../susfs/kernel_patches/include/linux/susfs.h include/linux/
          cp -r ../susfs/kernel_patches/fs/susfs.c fs/
          patch -p1 < ../susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

          # 3. Copy KernelSU into drivers/kernelsu directly
          cp -r ../KernelSU/kernel drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          cd ..

      - name: Force Max Frequency Lock (2.91 GHz Hard Cap)
        run: |
          cd kernel_source
          sed -i 's/policy->max = policy->user_policy.max;/policy->max = policy->cpuinfo.max_freq;/g' drivers/cpufreq/cpufreq.c || true

      - name: Apply Tuned Marble Config
        run: |
          cp config/gki_defconfig kernel_source/arch/arm64/configs/marble_tuned_defconfig

      - name: Build Kernel
        run: |
          set -e
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1

          cd kernel_source
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 O=out marble_tuned_defconfig
          make -j$(nproc) ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 O=out Image > /tmp/build_kernel.log 2>&1 || {
            echo "=========================================================="
            echo "============== KERNEL BUILD FAILED: LAST 300 LINES ======="
            echo "=========================================================="
            tail -n 300 /tmp/build_kernel.log
            exit 2
          }

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Build-Failure-Log
          path: /tmp/build_kernel.log

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's/device.name1=.*/device.name1=marble/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=marblein/g' AnyKernel3/anykernel.sh

          IMAGE=""
          if [ -f "kernel_source/out/arch/arm64/boot/Image" ]; then
            IMAGE="kernel_source/out/arch/arm64/boot/Image"
          elif [ -f "kernel_source/arch/arm64/boot/Image" ]; then
            IMAGE="kernel_source/arch/arm64/boot/Image"
          fi

          if [ -z "$IMAGE" ]; then
            echo "ERROR: Kernel Image not found!"
            find kernel_source -name Image
            exit 1
          fi

          cp "$IMAGE" AnyKernel3/
          cd AnyKernel3
          zip -r9 ../AnyKernel3-Marble-GKI-5.10-Tuned-SuSFS-v2.4.0.zip * -x .git README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marble-GKI-Tuned-SuSFS-v2.4.0
          path: AnyKernel3-Marble-GKI-5.10-Tuned-SuSFS-v2.4.0.zip
