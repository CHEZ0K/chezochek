name: Build Marble GKI Tuned Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Tuned Marble GKI Kernel (KSU-Next + SuSFS v2.4.0)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Add Swap Space
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex \
            git libelf-dev libssl-dev lz4 make python3 rsync unzip zip zstd libncurses-dev

      - name: Download AOSP Clang Toolchain
        run: |
          mkdir -p clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz

      - name: Clone GKI 5.10 Kernel Source
        run: |
          git clone --depth=1 --branch android12-5.10 https://android.googlesource.com/kernel/common kernel_source

      - name: Integrate KernelSU and SuSFS (v2.4.0)
        run: |
          git clone https://github.com/tiann/KernelSU.git KernelSU
          git -C KernelSU checkout c680b548f3fe5c19f51e90ce97d6f0ef89594421
          git clone --depth=1 --branch gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git susfs

          # 1. Patch KernelSU with SuSFS v2.4.0
          cd KernelSU
          patch -p1 < ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          # Bypass apk signature check so any Manager APK (KernelSU Manager / KernelSU-Next Manager) is accepted
          sed -i 's/return check_v2_signature(path, EXPECTED_SIZE, EXPECTED_HASH);/return true;/g' kernel/manager/apk_sign.c
          cd ..

          # 2. Patch kernel_source with SuSFS v2.4.0
          cd kernel_source
          cp -r ../susfs/kernel_patches/include/linux/susfs.h include/linux/
          cp -r ../susfs/kernel_patches/fs/susfs.c fs/
          patch -p1 < ../susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch
          rm -f android/abi_gki_protected_exports_*

          # 3. Copy KernelSU into drivers/kernelsu directly
          cp -r ../KernelSU/kernel drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          cd ..

      - name: Force Max Frequency Lock (2.91 GHz Hard Cap)
        run: |
          cd kernel_source
          # Lock policy->max directly to hardware max capability (2.91 GHz Prime, 2.49 GHz Gold, 1.80 GHz Silver)
          sed -i 's/policy->max = new_data.max;/policy->max = policy->cpuinfo.max_freq;/g' drivers/cpufreq/cpufreq.c
          grep -n "policy->max = policy->cpuinfo.max_freq;" drivers/cpufreq/cpufreq.c

      - name: Configure Tuned GKI Defconfig
        run: |
          cd kernel_source
          DEFCONFIG="arch/arm64/configs/gki_defconfig"

          # KernelSU & OverlayFS
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "CONFIG_OVERLAY_FS=y" >> "$DEFCONFIG"
          echo "CONFIG_MODULES=y" >> "$DEFCONFIG"
          echo "CONFIG_KPROBES=y" >> "$DEFCONFIG"
          echo "CONFIG_HAVE_KPROBES=y" >> "$DEFCONFIG"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG"

          # SuSFS Options from Kconfig
          for sym in $(grep -rhoE '^[[:space:]]*config[[:space:]]+KSU_SUSFS[A-Z_]*' fs/Kconfig drivers/kernelsu/ 2>/dev/null | awk '{print $2}' | sort -u); do
            case "$sym" in
              KSU_SUSFS_SUS_SU|KSU_SUSFS_SUS_OVERLAYFS)
                echo "# CONFIG_${sym} is not set" >> "$DEFCONFIG"
                ;;
              *)
                echo "CONFIG_${sym}=y" >> "$DEFCONFIG"
                ;;
            esac
          done

          # Required Debug Symbols (Never disable)
          echo "CONFIG_DEBUG_INFO=y" >> "$DEFCONFIG"
          echo "CONFIG_DEBUG_BUGVERBOSE=y" >> "$DEFCONFIG"
          echo "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG"
          echo "CONFIG_PRINTK_TIME=y" >> "$DEFCONFIG"
          echo "CONFIG_PSTORE_RAM=y" >> "$DEFCONFIG"
          echo "CONFIG_DEBUG_FS=y" >> "$DEFCONFIG"
          echo "CONFIG_DEBUG_FS_ALLOW_ALL=y" >> "$DEFCONFIG"

          # Performance & Networking
          echo "CONFIG_TCP_CONG_BBR=y" >> "$DEFCONFIG"
          echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> "$DEFCONFIG"
          echo "CONFIG_NET_SCH_FQ_CODEL=y" >> "$DEFCONFIG"
          echo "CONFIG_DEFAULT_FQ_CODEL=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET=y" >> "$DEFCONFIG"

          # Disable WERROR so warnings never abort compilation
          echo "# CONFIG_WERROR is not set" >> "$DEFCONFIG"
          echo "# CONFIG_CC_WERROR is not set" >> "$DEFCONFIG"

          # Prefer ThinLTO for memory-efficient link
          echo "# CONFIG_LTO_CLANG_FULL is not set" >> "$DEFCONFIG"
          echo "CONFIG_LTO_CLANG_THIN=y" >> "$DEFCONFIG"

      - name: Build Kernel
        run: |
          set -e
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1

          cd kernel_source
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- O=out gki_defconfig
          make -j$(nproc) ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- O=out Image

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/WildKernels/AnyKernel3.git -b gki-2.0 AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=Marble Tuned GKI (KSU-Next + SuSFS v2.4.0)/g' AnyKernel3/anykernel.sh

          IMAGE=""
          if [ -f "kernel_source/out/arch/arm64/boot/Image" ]; then
            IMAGE="kernel_source/out/arch/arm64/boot/Image"
          elif [ -f "kernel_source/arch/arm64/boot/Image" ]; then
            IMAGE="kernel_source/arch/arm64/boot/Image"
          fi

          if [ -z "$IMAGE" ]; then
            echo "ERROR: Kernel Image not found!"
            find kernel_source -name Image
            exit 1
          fi

          cp "$IMAGE" AnyKernel3/
          cd AnyKernel3
          zip -r9 ../AnyKernel3-Marble-GKI-5.10-Tuned-SuSFS-v2.4.0.zip * -x .git README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marble-GKI-Tuned-SuSFS-v2.4.0
          path: AnyKernel3-Marble-GKI-5.10-Tuned-SuSFS-v2.4.0.zip
